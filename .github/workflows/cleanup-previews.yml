# Cleanup Preview Deployments
# Removes the previews of closed PRs from the preview repository every 15
# minutes. Scheduled rather than on pull_request close, so it doesn't show
# as a skipped check on open PRs.
#
# The step is the cleanup action in https://github.com/wafer-space/actions.
# A copy of this repository only cleans up if its PREVIEW_REPOSITORY and
# PREVIEW_BASE_URL variables are set (see pr-preview-deploy.yml).

name: Cleanup Preview Deployments

on:
  schedule:
    - cron: '*/15 * * * *'

  # Manual trigger for testing and immediate cleanup
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'Only clean up this PR (optional)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-previews
  cancel-in-progress: false

jobs:
  cleanup-closed-pr-previews:
    if: >
      github.repository == 'wafer-space/wafer-space.github.io' ||
      (vars.PREVIEW_REPOSITORY != '' && vars.PREVIEW_BASE_URL != '')
    runs-on: ubuntu-latest
    steps:
      - uses: wafer-space/actions/pr-preview/cleanup@33cb4040b0bceb4f726fc82a01d688cc0e10c75c
        with:
          preview-repository: ${{ vars.PREVIEW_REPOSITORY || 'wafer-space/preview.wafer.space' }}
          preview-key: ${{ secrets.PREVIEW_KEY }}
          preview-base-url: ${{ vars.PREVIEW_BASE_URL || 'https://preview.wafer.space' }}
          pr-number: ${{ github.event.inputs.pr_number }}
