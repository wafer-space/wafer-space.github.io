# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# Sample workflow for building and deploying a Jekyll site to GitHub Pages
# This workflow handles private theme submodules using SSH deploy keys
#
# Setup required:
# 1. Generate an SSH key pair for the theme repository access
# 2. Add the public key as a deploy key to the theme repository with read access
# 3. Add the private key as a repository secret named 'JEKYLL_THEME_KEY' in:
#    Settings > Secrets and variables > Actions
name: Deploy Jekyll site to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    outputs:
      redirects_number: ${{ steps.redirects-revision.outputs.number }}
      redirects_commit: ${{ steps.redirects-revision.outputs.commit }}
    steps:
      - name: Setup SSH for private submodule
        run: |
          # Setup SSH key for private repository access
          mkdir -p ~/.ssh
          echo "${{ secrets.JEKYLL_THEME_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: false
          # Full history and tags: redirects.json records `git describe`
          fetch-depth: 0
      
      - name: Initialize submodules with SSH
        run: |
          # Initialize submodules using SSH (without HTTPS conversion)
          git submodule sync --recursive
          git submodule update --init --recursive
          
      - name: Setup Ruby
        # https://github.com/ruby/setup-ruby/releases/tag/v1.207.0
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1' # Not needed with a .ruby-version file
          bundler-cache: true # runs 'bundle install' and caches installed gems automatically
          cache-version: 0 # Increment this number if you need to re-download cached gems
      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build with Jekyll
        # Outputs to the './_site' directory by default
        run: bundle exec jekyll build --baseurl "${{ steps.pages.outputs.base_path }}"
        env:
          JEKYLL_ENV: production
      # For the sync-redirects job. If it can't be read, the site still
      # deploys and that job reports the error.
      - name: Read the redirect list's revision
        id: redirects-revision
        continue-on-error: true
        run: >-
          python3 .github/scripts/redirects-sync.py --list wafer_space
          --from-file _site/redirects.json --print-revision >> "$GITHUB_OUTPUT"
      - name: Upload artifact
        # Automatically uploads an artifact from the './_site' directory by default
        uses: actions/upload-pages-artifact@v3

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    # Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
    # However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # Load the redirects.json just deployed into Cloudflare's wafer.space Bulk
  # Redirects, retrying until Pages serves it; a later deploy's revision
  # counts as success. See github.com/wafer-space/cloudflare-redirects-sync.
  # A job of its own, so re-running a failed sync never re-publishes this
  # run's (possibly older) site, and a slow sync doesn't hold up the next
  # deploy. It fails the run, as the site is then live with stale redirects
  # until the Worker's cron trigger loads them.
  sync-redirects:
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Check the redirect list's revision was read
        if: needs.build.outputs.redirects_number == '' || needs.build.outputs.redirects_commit == ''
        run: |
          echo "::error::The build couldn't read the revision of _site/redirects.json (see its \"Read the redirect list's revision\" step)"
          exit 1

      - name: Checkout the sync script
        uses: actions/checkout@v4
        with:
          sparse-checkout: .github/scripts/redirects-sync.py
          sparse-checkout-cone-mode: false

      - name: Sync Cloudflare redirects
        run: >-
          python3 .github/scripts/redirects-sync.py --list wafer_space --require-secrets
          --number "${{ needs.build.outputs.redirects_number }}"
          --commit "${{ needs.build.outputs.redirects_commit }}"
        env:
          REDIRECTS_SYNC_URL: ${{ vars.REDIRECTS_SYNC_URL }}
          REDIRECTS_SYNC_SECRET: ${{ secrets.REDIRECTS_SYNC_SECRET }}
