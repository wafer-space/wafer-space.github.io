# PR Preview Build (Stage 1 - Untrusted Context)
# This workflow runs for ALL pull requests, including those from forks
# It has NO access to secrets. Its only job is to finish, which triggers
# Stage 2 (pr-preview-deploy.yml) via workflow_run.
#
# SECURITY NOTE: This workflow runs the FORK's version of this file.
# A malicious fork can modify this workflow arbitrarily. Therefore:
# - Stage 2 uses nothing from this run except the event GitHub creates
#   for it (head repository, branch and SHA), and checks those against
#   the GitHub API
# - The executable code check here is informational only, so authors see
#   early that Stage 2 will block their preview
#
# The steps are actions in https://github.com/wafer-space/github-actions
name: PR Preview Build

on:
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read  # Needed to list PR changed files

jobs:
  collect-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Check for executable code changes
        uses: wafer-space/github-actions/pr-preview/check-changes@273b2c072b958163d5ddbc14b62ae4c043012ea9
