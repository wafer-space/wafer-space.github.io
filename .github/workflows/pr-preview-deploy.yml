# PR Preview Deploy (Stage 2 - Trusted Context)
# This workflow is triggered by workflow_run after Stage 1 completes
# It has FULL access to secrets and runs from the base branch (trusted)
#
# SECURITY MODEL: Stage 1 runs the fork's version of its workflow, so
# nothing it produces can be trusted. This workflow identifies the PR
# only from the workflow_run event itself (head repository, branch and
# SHA, which GitHub sets) plus the GitHub API, and downloads no artifact.
name: PR Preview Deploy

on:
  workflow_run:
    workflows: ["PR Preview Build"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  deployments: write
  actions: write  # Needed to start the link check (preview-verification.yml)

# Prevent concurrent deployments - cancel old runs when new commits pushed.
# workflow_run.pull_requests is always empty for fork PRs, so key on the
# head repository and branch instead of the PR number.
concurrency:
  group: pr-preview-deployment-${{ github.event.workflow_run.head_repository.full_name }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  deploy-preview:
    # Only run if Stage 1 succeeded on a pull request
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    env:
      # Where previews are pushed and served. Repository variables let a
      # fork deploy to its own preview repository, e.g. for testing changes
      # to these workflows; a URL with a path (a project Pages site such as
      # https://user.github.io/preview.wafer.space) is supported.
      PREVIEW_REPOSITORY: ${{ vars.PREVIEW_REPOSITORY || 'wafer-space/preview.wafer.space' }}
      PREVIEW_BASE_URL: ${{ vars.PREVIEW_BASE_URL || 'https://preview.wafer.space' }}

    steps:
      # SECURITY: Identify the PR from trusted data only. GitHub leaves
      # workflow_run.pull_requests empty for fork PRs, so look up the open
      # PR whose head is the triggering run's repository and branch, and
      # require its head SHA to be the commit Stage 1 ran on.
      - name: Find pull request and check it is safe to build
        id: pr
        uses: actions/github-script@v7
        with:
          script: |
            const run = context.payload.workflow_run;
            const headRepo = run.head_repository.full_name;

            const prs = await github.paginate(github.rest.pulls.list, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              head: `${run.head_repository.owner.login}:${run.head_branch}`,
              per_page: 100
            });
            const pr = prs.find(p =>
              p.head.sha === run.head_sha && p.head.repo && p.head.repo.full_name === headRepo
            );
            if (!pr) {
              // A newer push (which gets its own run) or a closed PR
              core.notice(`No open PR from ${headRepo}:${run.head_branch} has head ${run.head_sha}; nothing to deploy`);
              core.setOutput('found', 'false');
              return;
            }

            const prNumber = pr.number;
            const isFork = headRepo !== `${context.repo.owner}/${context.repo.repo}`;
            core.setOutput('found', 'true');
            core.setOutput('number', prNumber.toString());
            core.setOutput('sha', pr.head.sha);
            core.setOutput('title', pr.title.slice(0, 100).replace(/[\r\n]/g, ' '));
            core.setOutput('is_fork', isFork.toString());

            console.log(`PR #${prNumber} from ${headRepo} at ${pr.head.sha} (fork: ${isFork})`);

            // Internal PRs: always allowed
            if (!isFork) {
              core.setOutput('deployment_allowed', 'true');
              console.log('✅ Internal PR — deployment always allowed');
              return;
            }

            // Fork PRs: check for dangerous file changes
            const files = await github.paginate(
              github.rest.pulls.listFiles,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: prNumber,
                per_page: 100
              }
            );

            const dangerousPatterns = [
              /^_plugins\//,
              /^\.github\//,
            ];

            const dangerousFiles = files
              .map(f => f.filename)
              .filter(f => dangerousPatterns.some(p => p.test(f)));

            if (dangerousFiles.length > 0) {
              core.setOutput('deployment_allowed', 'false');
              core.setOutput('dangerous_files', dangerousFiles.join('\n'));
              core.warning(`🚫 Fork PR modifies executable code: ${dangerousFiles.join(', ')}`);
            } else {
              core.setOutput('deployment_allowed', 'true');
              console.log('✅ Fork PR — content-only changes — deployment allowed');
            }

      - name: Checkout PR code from git
        if: steps.pr.outputs.deployment_allowed == 'true'
        uses: actions/checkout@v4
        with:
          # The head SHA the triggering run was for, confirmed against the API
          ref: ${{ steps.pr.outputs.sha }}
          submodules: false  # We'll handle submodules separately
          # Don't leave this job's write token in .git/config, where code
          # from the PR could read it
          persist-credentials: false
          # actions/checkout refuses fork code in workflow_run unless told
          # otherwise. Building fork PRs is this workflow's purpose: fork PRs
          # changing _plugins/ or .github/ are blocked above, and the next
          # steps replace every file that can run code during the build
          # (_plugins, Gemfile, .bundle, .gitmodules, _config overrides)
          # with main's copies
          allow-unsafe-pr-checkout: true

      # SECURITY: Every script, template and overlay file used from here on
      # comes from this copy of main, never from the PR's checkout. The
      # leading underscore keeps Jekyll from building it into the site.
      - name: Checkout trusted copy of main
        if: steps.pr.outputs.deployment_allowed == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: _trusted_main
          persist-credentials: false

      # SECURITY: For fork PRs, replace everything that can run code during
      # the build with trusted versions from main:
      # - _plugins/ (Ruby code Jekyll runs), including files the fork had
      #   before this PR, which don't appear in the PR diff
      # - Gemfile (gems Bundler installs and loads); any Gemfile.lock is
      #   removed, as main has none
      # - .bundle/ (Bundler config could point BUNDLE_GEMFILE elsewhere)
      # - .gitmodules (where the theme submodule is fetched from)
      # and stack a config that stops _config.yml redirecting plugins_dir,
      # source or destination.
      - name: Apply security overrides for fork PRs
        if: steps.pr.outputs.deployment_allowed == 'true' && steps.pr.outputs.is_fork == 'true'
        id: gemfile-check
        run: |
          set -e
          echo "🔒 Applying security overrides for fork PR..."

          cat > _config_security.yml << 'SECURITY_EOF'
          # Security overrides for fork PR builds - do not modify
          plugins_dir: _plugins
          source: .
          destination: _site
          SECURITY_EOF

          rm -rf _plugins/
          cp -r _trusted_main/_plugins _plugins
          echo "✅ Replaced _plugins/ with trusted version from main"

          # Gemfile.lock is gitignored, so main has none. A fork could still
          # commit one to pin gem versions or sources, so remove it.
          if cmp -s Gemfile _trusted_main/Gemfile && [ ! -e Gemfile.lock ]; then
            echo "gemfile_modified=false" >> $GITHUB_OUTPUT
          else
            echo "gemfile_modified=true" >> $GITHUB_OUTPUT
            echo "⚠️  Gemfile changes detected in fork PR"
          fi
          cp _trusted_main/Gemfile .
          rm -f Gemfile.lock
          echo "✅ Using trusted Gemfile from main"

          rm -rf .bundle
          cp _trusted_main/.gitmodules .gitmodules
          echo "✅ Removed .bundle/ and used trusted .gitmodules"

      - name: Initialize private theme submodule with SSH
        if: steps.pr.outputs.deployment_allowed == 'true'
        run: |
          echo "🔐 Checking out private theme submodule..."
          # Setup SSH agent with theme deploy key
          eval $(ssh-agent -s)
          echo "${{ secrets.JEKYLL_THEME_KEY }}" | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Initialize and update theme submodule
          git submodule sync --recursive
          git submodule update --init --recursive

          # Stop the agent so the key isn't available to later steps
          ssh-agent -k

          echo "✅ Private theme checked out successfully"

      - name: Setup Ruby and dependencies
        if: steps.pr.outputs.deployment_allowed == 'true'
        uses: ruby/setup-ruby@4a9ddd6f338a97768b8006bf671dfbad383215f4
        with:
          ruby-version: '3.1'
          bundler-cache: true
          cache-version: 0

      - name: Generate PR directory name
        if: steps.pr.outputs.deployment_allowed == 'true'
        id: pr-directory
        uses: actions/github-script@v7
        # Pass title via env to prevent expression injection (the title is
        # chosen by the PR author)
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
        with:
          script: |
            const generatePrDirectoryName = require('./_trusted_main/.github/scripts/generate-pr-directory-name.js');
            const prNumber = ${{ steps.pr.outputs.number }};
            const prTitle = process.env.PR_TITLE;

            if (!/^[A-Za-z0-9_.-]+\/[A-Za-z0-9_.-]+$/.test(process.env.PREVIEW_REPOSITORY)) {
              throw new Error(`Invalid PREVIEW_REPOSITORY: ${process.env.PREVIEW_REPOSITORY}`);
            }
            if (!/^https:\/\/[A-Za-z0-9.-]+(\/[A-Za-z0-9._-]+)*\/?$/.test(process.env.PREVIEW_BASE_URL)) {
              throw new Error(`Invalid PREVIEW_BASE_URL: ${process.env.PREVIEW_BASE_URL}`);
            }
            const baseUrl = process.env.PREVIEW_BASE_URL.replace(/\/+$/, '');
            // '' for https://preview.wafer.space, '/repo' for a project Pages site
            const basePath = new URL(baseUrl).pathname.replace(/\/+$/, '');

            // Main directory uses just PR number for simplicity
            const directoryName = `pr-${prNumber}`;
            // Slugified version for user-friendly redirect
            const slugifiedName = generatePrDirectoryName(prNumber, prTitle);

            console.log(`Main directory: ${directoryName}`);
            console.log(`Slugified redirect: ${slugifiedName}`);
            console.log(`Preview URL: ${baseUrl}/${directoryName}/`);

            // Set outputs
            core.setOutput('directory_name', directoryName);
            core.setOutput('slugified_name', slugifiedName);
            core.setOutput('base_url', baseUrl);
            core.setOutput('base_path', basePath);
            core.setOutput('baseurl_path', `${basePath}/${directoryName}`);

            return directoryName;

      - name: Build Jekyll site with private theme
        if: steps.pr.outputs.deployment_allowed == 'true'
        run: |
          BASEURL="${{ steps.pr-directory.outputs.baseurl_path }}"
          export PATH=$PATH:~/.local/share/gem/ruby/3.1.0/bin
          echo "🔨 Building Jekyll site..."
          # For fork PRs, stack security config to override dangerous settings
          CONFIG_FLAG=""
          if [ -f _config_security.yml ]; then
            CONFIG_FLAG="--config _config.yml,_config_security.yml"
            echo "🔒 Using security config override"
          fi
          bundle exec jekyll build --baseurl "$BASEURL" --future $CONFIG_FLAG
          echo "✅ Site built successfully"
        env:
          JEKYLL_ENV: production

      - name: Save built site for deployment
        if: steps.pr.outputs.deployment_allowed == 'true'
        run: |
          DIR_NAME="${{ steps.pr-directory.outputs.directory_name }}"
          # Save to temp location. Scripts and templates come from the
          # trusted copy of main, not the PR's .github/
          cp -r _site "/tmp/pr-site-${DIR_NAME}"
          cp -r _trusted_main/.github "/tmp/pr-github-${DIR_NAME}"

      - name: Clone preview repository and deploy
        if: steps.pr.outputs.deployment_allowed == 'true'
        run: |
          # Assign outputs to shell variables for safe quoting
          DIR_NAME="${{ steps.pr-directory.outputs.directory_name }}"
          SLUG_NAME="${{ steps.pr-directory.outputs.slugified_name }}"
          PR_NUM="${{ steps.pr.outputs.number }}"
          PR_SHA="${{ steps.pr.outputs.sha }}"
          BASE_PATH="${{ steps.pr-directory.outputs.base_path }}"

          echo "🚀 Deploying to $PREVIEW_REPOSITORY..."

          # Setup SSH for preview repo
          eval $(ssh-agent -s)
          echo "${{ secrets.PREVIEW_KEY }}" | ssh-add -
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan github.com >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

          # Clone preview repository
          git clone "git@github.com:${PREVIEW_REPOSITORY}.git" preview-repo
          cd preview-repo

          # Configure git
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'

          # Create PR directory and copy built site
          mkdir -p "$DIR_NAME"
          cp -r "/tmp/pr-site-${DIR_NAME}/"* "$DIR_NAME/"

          # Create redirect page for slugified URL if different
          if [ "$SLUG_NAME" != "$DIR_NAME" ]; then
            mkdir -p "$SLUG_NAME"
            cp "/tmp/pr-github-${DIR_NAME}/templates/redirect-template.html" "$SLUG_NAME/index.html"
            sed -i "s|{{TARGET_URL}}|${BASE_PATH}/${DIR_NAME}|g" "$SLUG_NAME/index.html"
            echo "Created redirect from $SLUG_NAME to $DIR_NAME"
          fi

          # Ensure CNAME file exists when previews have their own domain
          # (a project Pages site under a path uses its owner's domain)
          if [ -z "$BASE_PATH" ] && [ ! -f CNAME ]; then
            echo "$PREVIEW_BASE_URL" | sed -E 's#^https://##; s#/.*$##' > CNAME
          fi

          # Generate preview index page
          if [ -f "/tmp/pr-github-${DIR_NAME}/scripts/generate-preview-index.sh" ]; then
            cp "/tmp/pr-github-${DIR_NAME}/scripts/generate-preview-index.sh" ./
            mkdir -p .github/templates
            cp "/tmp/pr-github-${DIR_NAME}/templates/preview-index.html" .github/templates/
            chmod +x generate-preview-index.sh
            ./generate-preview-index.sh
          fi

          # Commit and push
          git add .
          if git diff --staged --quiet; then
            echo "ℹ️  No changes to commit"
            exit 0
          fi

          git commit -m "Deploy preview for PR #${PR_NUM} - ${PR_SHA}"

          # SSH agent is still active from earlier setup
          git push origin main

          echo "✅ Deployment complete"

      - name: Wait for Pages deployment
        if: steps.pr.outputs.deployment_allowed == 'true'
        id: verify-deployment
        run: |
          PREVIEW_URL="${{ steps.pr-directory.outputs.base_url }}/${{ steps.pr-directory.outputs.directory_name }}/"
          EXPECTED_COMMIT="${{ steps.pr.outputs.sha }}"

          echo "⏳ Waiting for GitHub Pages deployment..."
          echo "Preview URL: $PREVIEW_URL"
          echo "Expected commit: $EXPECTED_COMMIT"

          # Wait for basic HTTP response (3 minutes max)
          for i in {1..18}; do
            sleep 10
            echo "Attempt $i/18: Checking HTTP response..."

            if curl -s --fail --head "$PREVIEW_URL" > /dev/null; then
              echo "✅ Site is responding"
              break
            fi

            if [ $i -eq 18 ]; then
              echo "deployment_status=failed" >> $GITHUB_OUTPUT
              echo "error_message=No HTTP response after 3 minutes" >> $GITHUB_OUTPUT
              exit 1
            fi
          done

          # Verify content is correct (2 minutes max)
          for i in {1..24}; do
            sleep 5
            echo "Content verification attempt $i/24..."

            PAGE_CONTENT=$(curl -s "$PREVIEW_URL")
            HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$PREVIEW_URL")

            if [ "$HTTP_STATUS" = "200" ] && echo "$PAGE_CONTENT" | grep -q "wafer.space"; then
              echo "✅ Deployment verified successfully"
              echo "deployment_status=success" >> $GITHUB_OUTPUT
              echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
              exit 0
            fi
          done

          echo "⚠️  Verification timeout - deployment may still be propagating"
          echo "deployment_status=partial" >> $GITHUB_OUTPUT
          echo "preview_url=$PREVIEW_URL" >> $GITHUB_OUTPUT
          echo "error_message=Content verification timeout" >> $GITHUB_OUTPUT

      - name: Create GitHub deployment
        if: steps.pr.outputs.deployment_allowed == 'true' && steps.verify-deployment.outputs.deployment_status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const sha = '${{ steps.pr.outputs.sha }}';
            const previewUrl = '${{ steps.verify-deployment.outputs.preview_url }}';

            try {
              const { data: deployment } = await github.rest.repos.createDeployment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                ref: sha,
                environment: `pr-preview-${prNumber}`,
                transient_environment: true,
                production_environment: false,
                required_contexts: [],
                description: `PR #${prNumber} preview`,
                auto_merge: false
              });

              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'success',
                environment_url: previewUrl,
                description: 'Preview deployment successful'
              });

              console.log(`Created deployment ${deployment.id} for PR #${prNumber}`);
            } catch (error) {
              console.error('Failed to create deployment:', error.message);
              // Don't fail the workflow if deployment creation fails
            }

      - name: Comment on PR with preview URL
        if: steps.pr.outputs.deployment_allowed == 'true' && steps.verify-deployment.outputs.deployment_status == 'success'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const previewUrl = '${{ steps.verify-deployment.outputs.preview_url }}';
            const commitSha = '${{ steps.pr.outputs.sha }}'.substring(0, 7);
            const isFork = ${{ steps.pr.outputs.is_fork }};
            const gemfileModified = '${{ steps.gemfile-check.outputs.gemfile_modified }}' === 'true';

            const forkBadge = isFork ? '🌍 **External Contributor** (fork PR)' : '🏠 Internal PR';

            // Add Gemfile security notice for fork PRs with dependency changes
            let securityNotice = '';
            if (isFork && gemfileModified) {
              securityNotice = `\n\n> **🔒 Security Notice:** This PR includes changes to \`Gemfile\` or \`Gemfile.lock\`. For security, the preview was built using the trusted dependencies from the \`main\` branch. If you need to update dependencies, please work with a maintainer to submit those changes separately from an internal branch.\n`;
            }

            const commentBody = [
              '## ✅ Preview Deployment Ready!',
              '',
              forkBadge,
              '',
              '| Preview URL | Commit |',
              '|-------------|--------|',
              `| [View Preview](${previewUrl}) | \`${commitSha}\` |`,
              '',
              '**🎉 Your preview has been deployed successfully!**',
              '',
              `The preview site is available at: ${previewUrl}${securityNotice}`,
              '',
              '---',
              '<sub>⚡ Deployed via workflow_run (two-stage deployment) • Preview will be removed when PR is closed</sub>',
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
              console.log(`Updated comment ${botComment.id} on PR #${prNumber}`);
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
              console.log(`Created new comment on PR #${prNumber}`);
            }

      # preview-verification.yml can't find the PR from a workflow_run event
      # (this run is on the default branch, and pull_requests is empty for
      # forks), so start it directly. workflow_dispatch is one of the two
      # events GITHUB_TOKEN is allowed to trigger.
      - name: Start link check
        if: steps.pr.outputs.deployment_allowed == 'true' && steps.verify-deployment.outputs.deployment_status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ steps.pr.outputs.number }}
          PREVIEW_URL: ${{ steps.verify-deployment.outputs.preview_url }}
          HEAD_SHA: ${{ steps.pr.outputs.sha }}
        run: |
          gh workflow run preview-verification.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref "${{ github.event.repository.default_branch }}" \
            -f pr_number="$PR_NUMBER" \
            -f preview_url="$PREVIEW_URL" \
            -f head_sha="$HEAD_SHA"
          echo "✅ Started link check for PR #$PR_NUMBER"

      - name: Comment on PR if deployment failed
        if: steps.pr.outputs.deployment_allowed == 'true' && steps.verify-deployment.outputs.deployment_status == 'failed'
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const errorMessage = '${{ steps.verify-deployment.outputs.error_message }}';

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body: `## ❌ Preview Deployment Failed\n\n**Error:** ${errorMessage}\n\nPlease check the [workflow logs](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.`
            });

      - name: Comment on PR about blocked deployment
        if: steps.pr.outputs.deployment_allowed == 'false'
        uses: actions/github-script@v7
        env:
          DANGEROUS_FILES: ${{ steps.pr.outputs.dangerous_files }}
        with:
          script: |
            const prNumber = ${{ steps.pr.outputs.number }};
            const dangerousFiles = process.env.DANGEROUS_FILES;

            const commentBody = [
              '## 🚫 Preview Deployment Blocked',
              '',
              'This pull request modifies executable code that runs during the preview build:',
              '',
              '```',
              dangerousFiles,
              '```',
              '',
              '**Why?** For security, fork PRs that modify files in `_plugins/` or `.github/` cannot receive automatic preview deployments. These files execute during the build process with access to repository secrets.',
              '',
              '**What to do:**',
              '- If you only need content changes previewed, please move executable code changes to a separate PR',
              '- A maintainer can review the executable changes and deploy a preview manually',
              '',
              '---',
              '<sub>🔒 Blocked by security gate (two-stage deployment)</sub>',
            ].join('\n');

            // Find and update existing comment or create new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });

            const botComment = comments.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: commentBody
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: commentBody
              });
            }
