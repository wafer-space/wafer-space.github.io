# Preview Site Verification Workflow
# This workflow performs comprehensive verification of PR preview deployments
# Including link checking, asset validation, and site functionality tests
#
# The steps are the verify action in
# https://github.com/wafer-space/github-actions

name: Preview Site Verification

on:
  # Started by pr-preview-deploy.yml once a preview is deployed, or by hand.
  # It can't use workflow_run: that event gives no way to find the PR when
  # the triggering run is itself a workflow_run run on the default branch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
      preview_url:
        description: 'Preview URL to verify'
        required: true
      head_sha:
        description: 'Commit the preview should be built from (default: the PR head)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  actions: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Verify preview
        uses: wafer-space/github-actions/pr-preview/verify@273b2c072b958163d5ddbc14b62ae4c043012ea9
        with:
          pr-number: ${{ github.event.inputs.pr_number }}
          preview-url: ${{ github.event.inputs.preview_url }}
          head-sha: ${{ github.event.inputs.head_sha }}
          # URL regular expressions muffet skips. Don't add one without
          # finding out why the link fails first (see CLAUDE.md)
          muffet-excludes: |
            .*mailto:.*
            .*linkedin\.com.*
            .*hawaii\.edu.*
            .*timeanddate\.com.*
            .*reddit\.com.*
            .*electronics-lab\.com.*
            .*matrix\.to.*
            .*tinytapeout\.com/chips/silicon-proven.*
            .*siliconprawn\.org.*
