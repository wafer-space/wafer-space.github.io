# Preview Site Verification Workflow
# This workflow performs comprehensive verification of PR preview deployments
# Including link checking, asset validation, and site functionality tests
#
# The steps are the verify action in
# https://github.com/wafer-space/actions

name: Preview Site Verification

on:
  # Started by pr-preview-deploy.yml once a preview is deployed, or by hand.
  # It can't use workflow_run: that event gives no way to find the PR when
  # the triggering run is itself a workflow_run run on the default branch.
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to verify'
        required: true
      preview_url:
        description: 'Preview URL to verify'
        required: true
      head_sha:
        description: 'Commit the preview should be built from (default: the PR head)'
        required: false
        default: ''

permissions:
  contents: read
  pull-requests: write
  statuses: write
  actions: read

jobs:
  verify-preview:
    runs-on: ubuntu-latest

    steps:
      # The exclude list shared with the production check, from the branch
      # this run is on: pr-preview-deploy.yml starts it on the default
      # branch, never on a pull request's
      - name: Check out the link check's exclude list
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false
          sparse-checkout: .github/muffet-excludes.txt
          sparse-checkout-cone-mode: false

      - name: Read the exclude list
        id: excludes
        run: |
          {
            echo 'patterns<<MUFFET_EXCLUDES_END'
            grep -v -E '^(#|$)' .github/muffet-excludes.txt
            echo 'MUFFET_EXCLUDES_END'
          } >> "$GITHUB_OUTPUT"

      - name: Verify preview
        uses: wafer-space/actions/pr-preview/verify@61f75d177ab19cbf089205f1124373e32b5e33ca
        with:
          pr-number: ${{ github.event.inputs.pr_number }}
          preview-url: ${{ github.event.inputs.preview_url }}
          head-sha: ${{ github.event.inputs.head_sha }}
          # URL regular expressions muffet skips. Don't add one without
          # finding out why the link fails first (see CLAUDE.md)
          muffet-excludes: ${{ steps.excludes.outputs.patterns }}
